name: Release

on:
  push:
    branches: [main]
    paths: ['sources/**', 'metanorma.yml', 'metanorma.release.yml']
  workflow_dispatch:
    inputs:
      force-replace:
        description: 'Comma-separated doc IDs or glob patterns to force-replace published releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    uses: actions-mn/.github/.github/workflows/metanorma-release.yml@main
    with:
      force-replace: ${{ github.event.inputs.force-replace || '' }}
      default-visibility: public
    secrets: inherit

  notify-deploy:
    name: Trigger main site deploy
    needs: release
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch enosema.github.io build_deploy
        env:
          GH_TOKEN: ${{ secrets.ENOSEMA_CI_PAT_TOKEN }}
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh api repos/enosema/enosema.github.io/dispatches \
            -f event_type=docs-releases-published
